name: OneBreath
options:
  bundleIdPrefix: com.williamng
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES

targets:
  OneBreath:
    type: application
    platform: iOS
    sources:
      - path: OneBreath
    resources:
      - path: OneBreath/Assets.xcassets
    info:
      path: OneBreath/Info.plist
      properties:
        CFBundleDisplayName: OneBreath
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.williamng.OneBreath
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  OneBreathTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OneBreathTests
    dependencies:
      - target: OneBreath
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.williamng.OneBreathTests
